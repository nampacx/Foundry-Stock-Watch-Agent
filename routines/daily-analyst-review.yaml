# Foundry routine: recurring schedule -> hosted analyst agent.
# Weekdays at 07:00 Europe/Berlin (before the European open). The service enforces a minimum interval of 5 minutes.
# Change `cron` / `time_zone` to taste; the input is only a nudge, the agent always runs the full review.
name: daily-analyst-review
description: Daily analyst-information review of the stock watchlist.
enabled: true
triggers:
  weekday-morning:
    type: schedule
    cron: "0 7 * * 1-5"
    timeZone: Europe/Berlin
action:
  type: invoke_agent_responses_api
  agentName: analyst-agent
  input: Run the daily analyst review.
