# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
    azure.ai.connections: '>=1.0.0-beta.10'
    azure.ai.toolboxes: '>=1.0.0-beta.11'
    azure.ai.routines: '>=1.0.0-beta.10'
name: foundry-gh-triage-agent

services:
  # Foundry account + project + model deployment. Created by `azd provision`
  # (infra/main.bicep).
  ai-project:
    host: azure.ai.project
    # Keep in sync with "deployments" in infra/main.parameters.json (Bicep creates the deployment, this tells
    # azd/the agent extension which models the project has).
    deployments:
      - name: gpt-6-luna
        model:
          format: OpenAI
          name: gpt-6-luna
          version: '2026-09-22'
        sku:
          name: GlobalStandard
          capacity: 10

  # GitHub REST -> MCP server on Azure Functions (Flex Consumption). Provisioned by infra/main.bicep
  # (the resource is matched by name through the outputs below), code deployed by `azd deploy`.
  # Deployed before triage-agent (which `uses` it): the postdeploy hook wires the Foundry connection + toolbox.
  github-mcp:
    project: src/github-mcp
    language: dotnet
    host: function
    resourceGroup: ${GITHUB_MCP_RESOURCE_GROUP}
    resourceName: ${GITHUB_MCP_FUNCTION_NAME}
    hooks:
      postdeploy:
        windows:
          shell: pwsh
          run: ./scripts/register-github-mcp.ps1
        posix:
          shell: sh
          run: ./scripts/register-github-mcp.sh

  # The hosted triage agent (C#, Microsoft Agent Framework, Responses protocol).
  triage-agent:
    host: azure.ai.agent
    project: src/triage-agent
    language: docker
    docker:
      remoteBuild: true
    uses:
      - ai-project
      - github-mcp
    kind: hosted
    name: triage-agent
    description: Triages new GitHub issues by reading the repository code through a toolbox backed by our own GitHub REST MCP server (PAT in Key Vault).
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-6-luna
      MODEL_API: responses
      TOOLBOX_NAME: gh-triage-tools
      GITHUB_OWNER: nampacx
      GITHUB_REPOSITORY: Foundry-GH-Triage-Agent
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

  # The routine: GitHub "issue opened" -> triage-agent. Created by `azd deploy` after the agent.
  # Depends on the "github-conn" connection created by the postprovision hook.
  on-issue-opened:
    host: azure.ai.routine
    uses:
      - triage-agent
    $ref: ./routines/on-issue-opened.yaml

# One Bicep deployment (infra/main.bicep): a single resource group with the Foundry account/project/model/ACR
# and the GitHub MCP Function App + Key Vault. `azd down` removes it; add --purge for the soft-deleted vault.
infra:
  provider: bicep
  path: infra

hooks:
  postprovision:
    # 1. Creates the routine's GitHub OAuth connector (one-time consent).
    - windows:
        shell: pwsh
        run: ./scripts/setup-connections.ps1
        interactive: true
      posix:
        shell: sh
        run: ./scripts/setup-connections.sh
        interactive: true
    # 2. Stores the GitHub PAT in Key Vault.
    - windows:
        shell: pwsh
        run: ./scripts/store-github-pat.ps1
        interactive: true
      posix:
        shell: sh
        run: ./scripts/store-github-pat.sh
        interactive: true
