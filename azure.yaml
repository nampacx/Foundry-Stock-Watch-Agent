# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
    azure.ai.routines: '>=1.0.0-beta.10'
name: stock-watch

services:
  # Foundry account + project + model deployment. Created by `azd provision` (infra/main.bicep).
  ai-project:
    host: azure.ai.project
    # Keep in sync with "deployments" in infra/main.parameters.json.
    deployments:
      - name: gpt-6-luna
        model:
          format: OpenAI
          name: gpt-6-luna
          version: '2026-09-22'
        sku:
          name: GlobalStandard
          capacity: 230

  # The hosted analyst agent (C#, Microsoft Agent Framework, Responses protocol).
  stockwatch-agent:
    host: azure.ai.agent
    project: src/stockwatch-agent
    language: docker
    docker:
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: stockwatch-agent
    description: Reads the stock watchlist from Table storage, collects the last 24h of analyst information per company and stores one report row per company in the reports table.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-6-luna
      STORAGE_ACCOUNT_NAME: ${STORAGE_ACCOUNT_NAME}
      WATCHLIST_TABLE: ${WATCHLIST_TABLE}
      MAX_PARALLEL_COMPANIES: '1'
      REPORTS_TABLE: ${REPORTS_TABLE}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
    hooks:
      # The agent's own identity only exists after deployment; give it access to storage (service hooks run from
      # the service folder, hence ../../scripts).
      postdeploy:
        windows:
          shell: pwsh
          run: ../../scripts/grant-agent-access.ps1

  # The schedule: every weekday morning -> stockwatch-agent. Created by `azd deploy` after the agent.
  stockwatch-daily-review:
    host: azure.ai.routine
    uses:
      - stockwatch-agent
    $ref: ./routines/stockwatch-daily-review.yaml

  # Read-only API for the viewer (C#, Azure Functions on Flex Consumption). Reads the tables with its managed identity;
  # linked to the Static Web App as its /api backend (infra/resources.bicep).
  api:
    project: src/api
    host: function
    language: dotnet

  # The report viewer (React + Vite) on Azure Static Web Apps. Public for now, see README.
  web:
    project: src/web
    host: staticwebapp
    language: js
    dist: dist

# One Bicep deployment (infra/main.bicep). `azd down --purge` removes it.
infra:
  provider: bicep
  path: infra
