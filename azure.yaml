# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
    azure.ai.routines: '>=1.0.0-beta.10'
name: stock-watch

services:
  # Foundry account + project + model deployment. Created by `azd provision` (infra/main.bicep).
  ai-project:
    host: azure.ai.project
    # Keep in sync with "deployments" in infra/main.parameters.json.
    deployments:
      - name: gpt-6-luna
        model:
          format: OpenAI
          name: gpt-6-luna
          version: '2026-09-22'
        sku:
          name: GlobalStandard
          capacity: 10

  # The hosted analyst agent (C#, Microsoft Agent Framework, Responses protocol).
  stockwatch-agent:
    host: azure.ai.agent
    project: src/stockwatch-agent
    language: docker
    docker:
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: stockwatch-agent
    description: Reads the stock watchlist from Table storage, collects the last 24h of analyst information per company and stores one consolidated report in Blob storage.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-6-luna
      STORAGE_ACCOUNT_NAME: ${STORAGE_ACCOUNT_NAME}
      WATCHLIST_TABLE: ${WATCHLIST_TABLE}
      REPORTS_CONTAINER: ${REPORTS_CONTAINER}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

  # The schedule: every weekday morning -> stockwatch-agent. Created by `azd deploy` after the agent.
  stockwatch-daily-review:
    host: azure.ai.routine
    uses:
      - stockwatch-agent
    $ref: ./routines/stockwatch-daily-review.yaml

# One Bicep deployment (infra/main.bicep). `azd down --purge` removes it.
infra:
  provider: bicep
  path: infra
